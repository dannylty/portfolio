<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <script>
    // Must stay in <head>, on <html>, and inline -- all three matter.
    // <head>: runs before the browser paints anything, so there's no flash.
    // <html>: the root element carries the theme vars, so _base.scss can
    //   colour it immediately (body alone is too late -- the root paints first
    //   and would show default white between pages).
    // inline: an external file is a second round-trip; the page can paint
    //   before it lands.
    (function() {
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var savedTheme = localStorage.getItem('theme') || (prefersDark ? 'theme-dark' : 'theme-light');
      var savedFont = localStorage.getItem('font') || 'font-roboto';
      document.documentElement.classList.add(savedTheme, savedFont);
    })();
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
    <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
</body>
</html>
